[project]
name = "soqlmodel"
version = "0.1.0"
description = "Typed models and a SOQL query builder for Salesforce, generated from your org's schema."
readme = "README.md"
# 3.11 for stdlib tomllib. Widening this later is not a breaking change;
# narrowing it is — so the floor stays where zero runtime dependencies are
# possible (D9).
requires-python = ">=3.11"
dependencies = []

# No `license` key yet — deliberately, and it blocks the PyPI release. Picking
# one is the owner's call, not a default to be quietly applied; without it the
# package is all-rights-reserved and nobody can use it. See KNOWN_ISSUES.md.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/BetterSaas-engg/soqlmodel"
Issues = "https://github.com/BetterSaas-engg/soqlmodel/issues"

# Optional, never imported (D1/D15). soqlmodel types the client structurally,
# so snapshot, generate and check all work with this absent; it is needed only
# to construct the client that soqlmodel.execute is handed.
[project.optional-dependencies]
salesforce = ["simple-salesforce>=1.12"]

[project.scripts]
soqlmodel = "soqlmodel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Registered, but NOT excluded by default: the wheel check guards a failure
# mode nothing else can see, so it runs unless someone opts out explicitly
# with -m "not slow".
markers = ["slow: builds artifacts or shells out to slow tools"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
