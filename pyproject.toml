[project]
name = "soqlmodel"
version = "0.1.0"
description = "Typed models and a SOQL query builder for Salesforce, generated from your org's schema."
readme = "README.md"
# 3.11 for stdlib tomllib. Widening this later is not a breaking change;
# narrowing it is — so the floor stays where zero runtime dependencies are
# possible (D9).
requires-python = ">=3.11"
dependencies = []

# PEP 639: an SPDX expression plus the file, not the legacy `License ::`
# classifier. Setting both is an error on modern build backends, so there is
# deliberately no license classifier in the list below.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/BetterSaas-engg/soqlmodel"
Issues = "https://github.com/BetterSaas-engg/soqlmodel/issues"

# Optional, never imported (D1/D15). soqlmodel types the client structurally,
# so snapshot, generate and check all work with this absent; it is needed only
# to construct the client that soqlmodel.execute is handed.
[project.optional-dependencies]
salesforce = ["simple-salesforce>=1.12"]

[project.scripts]
soqlmodel = "soqlmodel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Registered, but NOT excluded by default: the wheel check guards a failure
# mode nothing else can see, so it runs unless someone opts out explicitly
# with -m "not slow".
markers = [
    "slow: builds artifacts or shells out to slow tools",
    # Opt-in via SOQLMODEL_LIVE_ORG=1, not via this marker: the marker makes an
    # opted-in run selectable, while the env var is what lets one happen at all.
    # See tests/test_live_org.py.
    "live: talks to a real Salesforce org over the network",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
